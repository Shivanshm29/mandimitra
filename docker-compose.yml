version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: mandimitra_postgres
    restart: always
    environment:
      POSTGRES_USER: mandimitra_user
      POSTGRES_PASSWORD: mandimitra_password
      POSTGRES_DB: mandimitra
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mandimitra_user -d mandimitra"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

